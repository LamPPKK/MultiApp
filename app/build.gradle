plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'org.waxmoon'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        if (rootProject.ext.isMasterPkg) {
            applicationId rootProject.ext.masterPkg
            manifestPlaceholders = [label: "Waxmoon", masterPkg: rootProject.ext.masterPkg]
        } else {
            applicationId rootProject.ext.assistPkg
            manifestPlaceholders = [label: "Waxmoon32", masterPkg: rootProject.ext.masterPkg]
            ndk.abiFilters 'armeabi-v7a'
        }
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        missingDimensionStrategy 'runtime', 'master'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            signingConfig.initWith(buildTypes.debug.signingConfig)
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/*'
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
    lint {
        checkReleaseBuilds true
        quiet true
        abortOnError false
        ignoreWarnings true
        disable += ["UnusedResources", 'RestrictedApi', 'TypographyFractions', 'TypographyQuotes']
        enable += ['RtlHardcoded', 'RtlCompat', 'RtlEnabled']
        checkOnly += ['NewApi', 'InlinedApi']
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
    options.encoding = "UTF-8"
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation project(path: ':opensdk')
}

// Master APKs must never package the stale prebuilt assistant from source control.
tasks.matching { it.name == 'preDebugBuild' }.configureEach {
    dependsOn ':assist:syncAssistDebugApk'
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn ':assist:syncAssistApk'
}
