plugins {
    id 'com.android.application'
}

android {
    namespace 'org.waxmoon'
    compileSdk rootProject.ext.compileSdkVersion


    defaultConfig {
        applicationId rootProject.ext.assistPkg
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        missingDimensionStrategy 'runtime', 'assistant'

        ndk.abiFilters 'armeabi-v7a'

        manifestPlaceholders = [masterPkg: rootProject.ext.masterPkg]
    }

    buildTypes {
        release {
            androidResources {
                ignoreAssetsPattern '!com.waxmoon.ma.gp.apk:!moon.jar'
            }
            signingConfig signingConfigs.debug
            signingConfig.initWith(buildTypes.debug.signingConfig)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation project(path: ':opensdk')
}

tasks.register('syncAssistDebugApk', Sync) {
    group = 'distribution'
    description = 'Builds the debug 32-bit assistant and embeds it in the debug master application assets.'
    dependsOn tasks.named('assembleDebug')
    from(layout.buildDirectory.dir('outputs/apk/debug')) {
        include 'assist-debug.apk'
        rename { 'assist.apk' }
    }
    into rootProject.layout.projectDirectory.dir('app/src/main/assets')
}

tasks.register('syncAssistApk', Sync) {
    group = 'distribution'
    description = 'Builds the 32-bit assistant and embeds it in the master application assets.'
    dependsOn tasks.named('assembleRelease')
    from(layout.buildDirectory.dir('outputs/apk/release')) {
        include 'assist-release.apk'
        rename { 'assist.apk' }
    }
    into rootProject.layout.projectDirectory.dir('app/src/main/assets')
}
